// --- Contenido de utils/songUtils.ts ---
const toTitleCase = (str) => {
  if (!str) return str;
  return str
    .toLowerCase()
    .split(' ')
    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
    .join(' ');
};
const normalizeSongKey = (songName) => {
  if (!songName) return '';
  return songName
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]/g, '');
};
const levenshteinDistance = (a, b) => {
    if (a.length === 0) return b.length;
    if (b.length === 0) return a.length;
    const matrix = Array(b.length + 1).fill(null).map(() => Array(a.length + 1).fill(null));
    for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
    for (let j = 0; j <= b.length; j++) matrix[j][0] = j;
    for (let j = 1; j <= b.length; j++) {
        for (let i = 1; i <= a.length; i++) {
            const cost = a[i - 1] === b[j - 1] ? 0 : 1;
            matrix[j][i] = Math.min(matrix[j][i - 1] + 1, matrix[j - 1][i] + 1, matrix[j - 1][i - 1] + cost);
        }
    }
    return matrix[b.length][a.length];
};
const processRecommendations = (data) => {
  const fuzzyGroups = [];
  data.forEach(rec => {
    if (!rec.song_name || !rec.guest_name) return;
    const currentSongKey = normalizeSongKey(rec.song_name);
    if (!currentSongKey) return;
    const capitalizedGuestName = toTitleCase(rec.guest_name.trim());
    const originalName = toTitleCase(rec.song_name.trim());
    let foundGroup = false;

    for (const group of fuzzyGroups) {
      const distance = levenshteinDistance(currentSongKey, group.key);
      if (distance / Math.max(currentSongKey.length, group.key.length) < 0.20) {
        group.originalNames.push(originalName);
        group.guests.add(capitalizedGuestName);
        if (currentSongKey.length > group.key.length) {
            group.key = currentSongKey;
        }
        foundGroup = true;
        break;
      }
    }
    if (!foundGroup) {
      fuzzyGroups.push({ key: currentSongKey, originalNames: [originalName], guests: new Set([capitalizedGuestName]) });
    }
  });

  const processedList = fuzzyGroups.map(group => {
    const nameCounts = new Map();
    group.originalNames.forEach(name => nameCounts.set(name, (nameCounts.get(name) || 0) + 1));
    let canonicalName = group.originalNames[0] || 'Canción Desconocida';
    let maxCount = 0;
    nameCounts.forEach((count, name) => {
      if (count > maxCount) {
        maxCount = count;
        canonicalName = name;
      } else if (count === maxCount && name.length > canonicalName.length) {
        canonicalName = name;
      }
    });

    const sortedGuests = Array.from(group.guests).sort();
    return { key: group.key, song_name: canonicalName, count: sortedGuests.length, guests: sortedGuests };
  });
  return processedList.sort((a, b) => b.count - a.count);
};

const Countdown = () => {
    const calculateTimeLeft = () => {
        const difference = +PARTY_DATE_OBJ - +new Date();
        let timeLeft = { dias: 0, horas: 0, minutos: 0 };
        if (difference > 0) {
            timeLeft = {
                dias: Math.floor(difference / (1000 * 60 * 60 * 24)),
                horas: Math.floor((difference / (1000 * 60 * 60)) % 24),
                minutos: Math.floor((difference / 1000 / 60) % 60),
            };
        }
        return timeLeft;
    };
    const [timeLeft, setTimeLeft] = useState(calculateTimeLeft());
    useEffect(() => {
        const timer = setInterval(() => setTimeLeft(calculateTimeLeft()), 1000);
        return () => clearInterval(timer);
    }, []);

    const timeUnits = [
        { label: 'Días', value: timeLeft.dias },
        { label: 'Horas', value: timeLeft.horas },
        { label: 'Minutos', value: timeLeft.minutos },
    ];
    const allZero = timeUnits.every(unit => unit.value === 0);

    return React.createElement('section', { className: "py-8" },
        React.createElement('h3', { className: "font-dancing-script text-4xl text-center text-rose-400 mb-6" }, "Falta muy poco..."),
        React.createElement('div', { className: "flex flex-wrap justify-center items-center gap-4 sm:gap-8" },

                    React.createElement('span', { className: "text-sm uppercase text-rose-500 tracking-wider mt-1" }, label)

            ))
        )
    );
};

// --- Componente DniSongModal.tsx ---
const DniSongModal = ({ isOpen, onClose, songName, onSuccess }) => {
    const [dni, setDni] = useState('');
    const [isLoading, setIsLoading] = useState(false);
    const [error, setError] = useState(null);

    const handleSubmit = useCallback(async (event) => {
        event.preventDefault();
        if (!dni.trim()) { setError("Por favor, ingresa tu DNI."); return; }
        setIsLoading(true);
        setError(null);
        try {
            const { data: guestData, error: findError } = await supabase.from('confirmed_guests').select('first_name').eq('dni', dni.trim()).single();
            if (findError || !guestData) {
                setError("Lo siento, no estás en la lista de invitados. No podés recomendar canciones.");
                setIsLoading(false);
                return;
            }
            const guestName = guestData.first_name;
            const trimmedSongName = toTitleCase(songName.trim());
            const { count, error: checkError } = await supabase.from('song_recommendations').select('*', { count: 'exact', head: true }).eq('guest_name', guestName).ilike('song_name', trimmedSongName);
            if (checkError) throw new Error("Error al verificar la recomendación.");
            if (count && count > 0) {
                setError(`${guestName}, ya has recomendado esta canción. ¿Quieres recomendar otra?`);
                setIsLoading(false);
                return;
            }
            const [geminiResponse, supabaseResult] = await Promise.all([
                getSongResponse(trimmedSongName, guestName),
                supabase.from('song_recommendations').insert([{ guest_name: guestName, song_name: trimmedSongName }])
            ]);
            if (supabaseResult.error) throw new Error("Error al guardar la recomendación.");
            onSuccess(geminiResponse);
        } catch (err) {
            setError("Ocurrió un error al enviar tu recomendación. Por favor, intenta de nuevo.");
        } finally {
            setIsLoading(false);
        }
    }, [dni, songName, onSuccess, onClose]);

    if (!isOpen) return null;

    return React.createElement('div', { className: "fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4 animate-fade-in", onClick: onClose, role: "dialog", 'aria-modal': "true", 'aria-labelledby': "modal-title-song" },

            React.createElement('form', { onSubmit: handleSubmit, className: "flex flex-col gap-4 items-center" },
                React.createElement('p', { className: "text-center font-light mb-2" }, "Ingresa tu DNI para validar tu recomendación."),
                React.createElement('input', { type: "text", value: dni, onChange: (e) => { setDni(e.target.value.replace(/[^0-9]/g, '')); if (error) setError(null); }, placeholder: "DNI (sin puntos)", className: "w-full px-4 py-3 rounded-full border border-rose-200 focus:outline-none focus:ring-2 focus:ring-rose-300 transition text-center", disabled: isLoading, 'aria-label': "DNI", inputMode: "numeric", pattern: "[0-9]*", autoFocus: true }),

                    isLoading ? "Enviando..." : "Enviar Recomendación"

const MusicIcon = () => React.createElement('svg', { xmlns: "http://www.w3.org/2000/svg", className: "h-6 w-6 inline-block mr-2", fill: "none", viewBox: "0 0 24 24", stroke: "currentColor", strokeWidth: 2 }, React.createElement('path', { strokeLinecap: "round", strokeLinejoin: "round", d: "M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-13c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z" }));
const SongRecommendation = () => {
  const [songName, setSongName] = useState('');
  const [responseMessage, setResponseMessage] = useState(null);

  const [allSongs, setAllSongs] = useState([]);
  const [suggestions, setSuggestions] = useState([]);
  const [isSuggestionsVisible, setIsSuggestionsVisible] = useState(false);

  useEffect(() => {
    const fetchAllSongs = async () => {
      const { data } = await supabase.from('song_recommendations').select('guest_name, song_name');
      if (data) {
        const processed = processRecommendations(data);
        const uniqueSongNames = [...new Set(processed.map(p => p.song_name))].sort();
        setAllSongs(uniqueSongNames);
      }
    };
    fetchAllSongs();
  }, []);

  const handleSubmit = useCallback((event) => {
    event.preventDefault();
    if (!songName.trim()) { setError("Por favor, escribe el nombre de una canción."); return; }
    setError(null);
    setResponseMessage(null);
    setIsSuggestionsVisible(false);
    setIsDniModalOpen(true);
  }, [songName]);

  const handleRecommendationSuccess = useCallback((message) => {
    setIsDniModalOpen(false);
    setResponseMessage(message);
    setSongName('');
    setSuggestions([]);
  }, []);

  const handleSongInputChange = (e) => {
    const value = e.target.value;
    setSongName(value);
    if(error) setError(null);

    if (value.trim().length > 1) {
        const inputWords = value.trim().toLowerCase().split(' ').filter(Boolean);
        
        const filtered = allSongs.filter(song => {
            const songTitleLower = song.toLowerCase();
            
            return inputWords.every(inputWord => {
                // Fast path: check if the word is a substring of the whole title
                if (songTitleLower.includes(inputWord)) {
                    return true;
                }
                
                // Slow path: fuzzy match against individual words in the song title
                const songWords = songTitleLower.split(' ').filter(Boolean);
                return songWords.some(songWord => {
                    const distance = levenshteinDistance(inputWord, songWord);
                    let tolerance = 0;
                    if (inputWord.length >= 8) tolerance = 2;
                    else if (inputWord.length >= 4) tolerance = 1;
                    return distance <= tolerance;

        });

        setSuggestions(filtered.slice(0, 5));
        setIsSuggestionsVisible(true);

        setSuggestions([]);
        setIsSuggestionsVisible(false);

    React.createElement('section', { className: "bg-white/60 p-8 rounded-xl shadow-lg text-center" },

          React.createElement('div', { className: "relative w-full" },
            React.createElement('input', { type: "text", value: songName, onChange: handleSongInputChange, onBlur: () => setTimeout(() => setIsSuggestionsVisible(false), 150), onFocus: handleSongInputChange, placeholder: "Nombre de la canción", className: "w-full px-4 py-3 rounded-full border border-rose-200 focus:outline-none focus:ring-2 focus:ring-rose-300 transition", 'aria-label': "Nombre de la canción", autoComplete: "off" }),
            isSuggestionsVisible && suggestions.length > 0 && React.createElement('ul', { className: "absolute z-10 w-full bg-white border border-rose-200 rounded-lg mt-1 shadow-lg max-h-48 overflow-y-auto text-left" },
              suggestions.map((suggestion, index) => React.createElement('li', { key: index, className: "px-4 py-2 cursor-pointer hover:bg-rose-50 transition-colors", onClick: () => handleSuggestionClick(suggestion) }, suggestion))
            )
          ),
          React.createElement('button', { type: "submit", className: "w-full bg-amber-500 text-white font-medium px-8 py-3 rounded-full shadow-md hover:bg-amber-600 transition-colors duration-300 flex items-center justify-center" },
            React.createElement(MusicIcon), " Recomendar"
          )
        )
      ) : React.createElement('div', { className: "text-center p-4 bg-rose-100 rounded-lg" },
        React.createElement('p', { className: "text-lg text-rose-600 font-medium" }, responseMessage),
        React.createElement('button', { onClick: () => setResponseMessage(null), className: "mt-4 text-sm text-rose-500 hover:underline" }, "Recomendar otra canción")
      ),
      error && React.createElement('p', { className: "text-red-500 mt-4" }, error)
    ),
    React.createElement(DniSongModal, { isOpen: isDniModalOpen, onClose: () => setIsDniModalOpen(false), songName: songName, onSuccess: handleRecommendationSuccess })
  );
};


// --- Componente DniConfirmationModal.tsx ---
const DniConfirmationModal = ({ isOpen, onClose }) => {
    const [dni, setDni] = useState('');
    const [isLoading, setIsLoading] = useState(false);
    const [error, setError] = useState(null);
    const [successMessage, setSuccessMessage] = useState(null);

    useEffect(() => {
        if (!isOpen) {
            setTimeout(() => {
                setDni(''); setError(null); setSuccessMessage(null); setIsLoading(false);
            }, 300);
        }
    }, [isOpen]);

    const handleSubmit = useCallback(async (event) => {
        event.preventDefault();
        if (!dni.trim()) { setError("Por favor, ingresa tu DNI."); return; }
        setIsLoading(true); setError(null); setSuccessMessage(null);
        try {
            const { data: guestData, error: findError } = await supabase.from('confirmed_guests').select('first_name, has_confirmed').eq('dni', dni.trim()).single();
            if (findError || !guestData) {
                setError("Tu DNI no se encuentra en la lista de invitados. Por favor, contacta al anfitrión.");
                setIsLoading(false); return;
            }
            if (guestData.has_confirmed) {
                setSuccessMessage(`¡Hola ${guestData.first_name}! Ya habías confirmado tu asistencia. ¡Nos vemos en la fiesta!`);
                setIsLoading(false); return;
            }
            const { error: updateError } = await supabase.from('confirmed_guests').update({ has_confirmed: true }).eq('dni', dni.trim());
            if (updateError) throw updateError;
            setSuccessMessage(`¡Confirmación exitosa, ${guestData.first_name}! Gracias por confirmar, te esperamos.`);
        } catch (err) {
            setError("Ocurrió un error al confirmar. Por favor, intenta de nuevo.");
        } finally {
            setIsLoading(false);
        }
    }, [dni]);

    if (!isOpen) return null;

    return React.createElement('div', { className: "fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4 animate-fade-in", onClick: onClose, role: "dialog", 'aria-modal': "true", 'aria-labelledby': "modal-title" },
        React.createElement('div', { className: "bg-[#FDF6F0] rounded-2xl shadow-2xl p-8 w-full max-w-sm text-[#5D504A] transform transition-transform duration-300 scale-95 animate-scale-up", onClick: (e) => e.stopPropagation() },
            React.createElement('button', { onClick: onClose, className: "absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-3xl transition-colors", 'aria-label': "Cerrar" }, "×"),
            React.createElement('h2', { id: "modal-title", className: "font-dancing-script text-4xl text-rose-400 mb-4 text-center" }, "Confirmar Asistencia"),
            successMessage ? React.createElement('div', { className: "text-center py-4" },
                React.createElement('p', { className: "text-lg text-green-600 font-medium" }, successMessage),
                React.createElement('button', { onClick: onClose, className: "mt-6 w-full bg-rose-400 text-white font-medium px-8 py-3 rounded-full shadow-md hover:bg-rose-500 transition-colors duration-300" }, "Cerrar")
            ) : React.createElement('form', { onSubmit: handleSubmit, className: "flex flex-col gap-4 items-center" },
                React.createElement('p', { className: "text-center font-light mb-2" }, "Ingresa tu número de DNI para confirmar tu lugar en la fiesta."),
                React.createElement('input', { type: "text", value: dni, onChange: (e) => { setDni(e.target.value.replace(/[^0-9]/g, '')); if (error) setError(null); }, placeholder: "DNI (sin puntos)", className: "w-full px-4 py-3 rounded-full border border-rose-200 focus:outline-none focus:ring-2 focus:ring-rose-300 transition text-center", disabled: isLoading, 'aria-label': "DNI", inputMode: "numeric", pattern: "[0-9]*", autoFocus: true }),
                React.createElement('button', { type: "submit", className: "w-full bg-amber-500 text-white font-medium px-8 py-3 rounded-full shadow-md hover:bg-amber-600 transition-colors duration-300 disabled:bg-amber-300 disabled:cursor-not-allowed flex items-center justify-center", disabled: isLoading },
                    isLoading ? "Verificando..." : "Confirmar"
                ),
                error && React.createElement('p', { className: "text-red-500 mt-2 text-sm text-center" }, error)
            )
        )
    );
};
